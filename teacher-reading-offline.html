:root{
  /* Farben und Radien der Vorlage */
  --background:#F4F0EB;
  --foreground:#363636;
  --card:#FFFFFF;
  --primary:#26247B;
  --primary-foreground:#FFFFFF;
  --muted:#E9E8F1;
  --muted-foreground:#6D6D6D;
  --border:#D5D4DF;
  --ring:#5A5595;
  --accent:#B99F6F;
  --gradient-start:#E8E4F0;
  --gradient-end:#D6E5F0;
  /* Eingeschaltet — grün, damit es ins Auge fällt; dieselbe Farbe wie die
     Schalter der Übungs-App. */
  --an:#45A05A;
  /* Die Regelstellen liegen auf der Warnfarbe der Vorlage. */
  --mark:#936515;
  --mark-line:#D19F49;
  --mark-bg:#F8F1DA;

  --radius-row:1.25rem;      /* rounded-lg der Vorlage */
  --radius-card:1rem;        /* rounded-2xl der Vorlage */
  --radius-input:.75rem;
  --radius-pill:9999px;

  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);

  --rail:16rem;              /* w-64 */
  --list:19rem;
  color-scheme:light only;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  color:var(--foreground);
  background:linear-gradient(to bottom right,var(--gradient-start),var(--gradient-end));
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,
              'Fira Sans','Droid Sans','Helvetica Neue',sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- Arabischer Text -------------------------------------------------------
   Rechtsläufig und gegen die Umgebung abgeschirmt, sonst rutschen lateinische
   Ziffern und Satzzeichen an die falsche Stelle. */
.ar{
  font-family:'Hafs','Traditional Arabic','Scheherazade New','Amiri',serif;
  direction:rtl;unicode-bidi:isolate;
}
/* Die indischen Ziffern am Versende sind die Versnummer; U+06DD davor setzt
   sie in die verzierte Kartusche, die aus Amiri Quran kommt. */
.ayah{
  font-family:'AyahMark','Hafs','Amiri Quran',serif;
  white-space:nowrap;padding-inline-start:.12em;
}
/* Einzelne arabische Buchstaben mitten in einem deutschen Lektionstitel:
   dieselbe Schrift, und abgeschirmt, damit sie an ihrem Platz bleiben. */
.arin{
  font-family:'Hafs','Traditional Arabic','Scheherazade New','Amiri',serif;
  unicode-bidi:isolate;
}
mark.hit{
  background:var(--mark-bg);color:var(--mark);border-radius:5px;padding:0 1px;
  box-shadow:0 0 0 1px var(--mark-line) inset;
}
/* Groß gesetzt genügt der farbige Grund; der Rahmen würde um ein einzelnes
   Vokalzeichen als hoher schmaler Kasten stehen. */
.subject mark.hit{border-radius:.12em;padding:0;box-shadow:none}

/* --- Gerüst --------------------------------------------------------------- */
.shell{display:flex;height:100%;overflow:hidden}

/* --- Lektionsauswahl links ------------------------------------------------ */
.rail{
  flex:0 0 var(--rail);width:var(--rail);
  display:flex;flex-direction:column;
  background:var(--card);border-right:1px solid var(--border);
}
.rail .brand{display:flex;align-items:center;padding:1rem 1rem .75rem}
.rail .brand img{height:2.25rem;width:auto}
.railhead,.listhead{
  display:flex;align-items:center;gap:.5rem;
  padding:.75rem 1rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.listhead{border-top:0}
.railhead h2,.listhead h2{
  margin:0;font-size:1rem;font-weight:600;color:var(--primary);
}
.railhead svg,.listhead svg{width:1.25rem;height:1.25rem;color:var(--primary);flex:0 0 auto}
.listhead .tally{margin-left:auto;font-size:.75rem;color:var(--muted-foreground)}

.lessons{flex:1 1 auto;overflow-y:auto;padding:.5rem}
.lessons .cap{
  padding:.75rem .5rem .25rem;
  font-size:.75rem;font-weight:600;line-height:1.333;
  color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:baseline;gap:.5rem;
}
.lessons .cap b{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none}
.lesson{
  display:flex;align-items:center;gap:.5rem;width:100%;
  padding:.5rem .75rem;border-radius:var(--radius-row);
  text-align:left;color:var(--primary);
  transition:background-color .15s,color .15s,box-shadow .15s;
}
.lesson:hover{background:var(--muted)}
.lesson[aria-current="true"]{
  background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-md);
}
.lesson .no{
  flex:0 0 1.5rem;font-size:.75rem;font-variant-numeric:tabular-nums;
  color:var(--muted-foreground);
}
.lesson[aria-current="true"] .no{color:rgba(255,255,255,.7)}
.lesson .tt{font-weight:500;min-width:0}
.lesson .ct{
  margin-left:auto;flex:0 0 auto;
  font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--muted-foreground);
}
.lesson[aria-current="true"] .ct{color:rgba(255,255,255,.7)}

/* --- Schalter ------------------------------------------------------------- */
.ctl{padding:.75rem 1rem;border-top:1px solid var(--border);display:grid;gap:.625rem}
.switch{display:flex;align-items:center;gap:.625rem;cursor:pointer;font-size:.8125rem}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{
  flex:0 0 auto;position:relative;width:2.25rem;height:1.25rem;
  border-radius:var(--radius-pill);background:var(--border);
  transition:background-color .15s;
}
.switch .track::after{
  content:"";position:absolute;top:.125rem;left:.125rem;
  width:1rem;height:1rem;border-radius:var(--radius-pill);
  background:#fff;box-shadow:var(--shadow-sm);transition:transform .15s;
}
.switch input:checked + .track{background:var(--an)}
.switch input:checked + .track::after{transform:translateX(1rem)}
.switch input:focus-visible + .track{outline:2px solid var(--ring);outline-offset:2px}
.switch .tx{color:var(--foreground)}
.switch .hint{color:var(--muted-foreground);font-size:.75rem}

.railfoot{
  padding:.5rem 1rem;border-top:1px solid var(--border);
  background:rgba(233,232,241,.5);
  font-size:.75rem;color:var(--muted-foreground);
}

/* --- Mitte ---------------------------------------------------------------- */
.stage{flex:1 1 auto;min-width:0;overflow-y:auto;display:flex}
/* „margin:auto“ statt „justify-content“: so steht die Aufgabe in der Mitte,
   und wird sie einmal höher als der Schirm, bleibt sie doch erreichbar. */
.stage .wrap{
  width:100%;max-width:56rem;margin:auto;padding:1.5rem 1rem;
  display:flex;flex-direction:column;gap:1.5rem;
}
@media (min-width:768px){.stage .wrap{padding:2rem 1rem}}
.stage h1{
  margin:0;text-align:center;font-weight:700;color:var(--primary);
  font-size:1.25rem;line-height:1.4;
}
@media (min-width:768px){.stage h1{font-size:1.5rem}}
@media (min-width:1024px){.stage h1{font-size:1.875rem;line-height:1.2}}
.stage .sub{margin:.25rem 0 0;text-align:center;font-size:.875rem;color:var(--muted-foreground)}

/* Lektionswahl auf kleinen Schirmen */
.pick{display:none;position:relative}
.pick select{
  width:100%;appearance:none;
  border:1px solid var(--border);border-radius:var(--radius-row);background:var(--card);
  padding:.75rem 2.5rem .75rem 1rem;
  font-size:.875rem;font-weight:500;color:var(--primary);box-shadow:var(--shadow-sm);
}
.pick svg{
  position:absolute;right:.75rem;top:50%;transform:translateY(-50%);
  width:1rem;height:1rem;color:var(--ring);pointer-events:none;
}

/* Wörter | Verse */
.seg{
  display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;
  min-height:2.5rem;align-items:center;
  border-radius:var(--radius-pill);background:var(--muted);padding:.25rem;
  color:var(--muted-foreground);
}
.seg button{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:2.5rem;padding:.5rem 1rem;border-radius:var(--radius-pill);
  font-size:.875rem;font-weight:500;transition:all .15s;
}
.seg button:hover:not(:disabled):not([aria-pressed="true"]){color:var(--primary)}
.seg button[aria-pressed="true"]{
  background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-sm);
}
.seg button:disabled{pointer-events:none;opacity:.5}

/* Die Sprachwahl steht im Rand und darf kleiner ausfallen. */
.seg.small{min-height:2rem}
.seg.small button{min-height:1.75rem;padding:.25rem .75rem;font-size:.75rem}

/* Die Leseaufgabe */
.card{
  border:1px solid var(--border);border-radius:var(--radius-card);
  background:var(--card);color:var(--foreground);box-shadow:var(--shadow-md);
}
.card .body{padding:2rem 1.5rem}
.card .row{display:flex;align-items:center;justify-content:center;gap:1rem}
.nav{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:3rem;height:3rem;border-radius:var(--radius-pill);
  transition:background-color .15s,color .15s;
}
.nav:hover:not(:disabled){background:var(--muted);color:var(--primary)}
.nav:disabled{pointer-events:none;opacity:.5}
.nav svg{width:2rem;height:2rem}
.subject{
  flex:1 1 auto;min-width:0;text-align:center;
  margin:0;font-size:2.25rem;line-height:1.625;
}
@media (min-width:640px){.subject{font-size:3rem}}
@media (min-width:768px){.subject{font-size:3.75rem}}
.subject.long{font-size:1.875rem}
@media (min-width:640px){.subject.long{font-size:2.25rem}}
@media (min-width:768px){.subject.long{font-size:3rem}}
.card .foot{margin-top:1.5rem;text-align:center;font-size:.875rem;color:var(--muted-foreground)}
.card .src{margin-top:.5rem;text-align:center;font-size:.75rem;color:var(--muted-foreground)}
.empty{padding:2rem 1.5rem;text-align:center;color:var(--muted-foreground)}

/* --- Liste der Leseaufgaben rechts ---------------------------------------- */
.side{
  flex:0 0 var(--list);width:var(--list);
  display:flex;flex-direction:column;
  background:var(--card);border-left:1px solid var(--border);
}
.items{flex:1 1 auto;overflow-y:auto;padding:.5rem;display:grid;gap:.125rem;align-content:start}
.item{
  display:flex;align-items:baseline;gap:.625rem;width:100%;
  padding:.5rem .75rem;border-radius:var(--radius-input);
  text-align:left;transition:background-color .15s,color .15s,box-shadow .15s;
}
.item:hover{background:var(--muted)}
.item[aria-current="true"]{
  background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-md);
}
.item .no{
  flex:0 0 1.75rem;font-size:.75rem;font-variant-numeric:tabular-nums;
  color:var(--muted-foreground);text-align:right;
}
.item[aria-current="true"] .no{color:rgba(255,255,255,.7)}
.item .tx{flex:1 1 auto;min-width:0;font-size:1.25rem;line-height:1.9;text-align:right}
.items .none{padding:1.5rem .75rem;text-align:center;color:var(--muted-foreground);font-size:.8125rem}

.ctlmob{display:none}

/* --- Schmale Schirme ------------------------------------------------------ */
@media (max-width:1023px){
  .shell{flex-direction:column;height:auto;min-height:100%;overflow:visible}
  .rail{display:none}
  .side{
    flex:1 1 auto;width:auto;border-left:0;border-top:1px solid var(--border);
    max-height:none;
  }
  .items{overflow-y:visible}
  .stage{overflow-y:visible}
  .pick{display:block}
  .ctlmob{display:block}
}
.ctlmob .ctl{
  border:1px solid var(--border);border-top:1px solid var(--border);
  border-radius:var(--radius-card);background:var(--card);box-shadow:var(--shadow-sm);
}
</style>
</head>

const FEHLER = {};        // block -> was schiefging
let AUFGABEN = [];        // die Leseaufgaben der gewählten Lektion und Gattung

const blockDa = f => Object.prototype.hasOwnProperty.call(DATA, f);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* Die Lektionstitel sind deutsch mit einzelnen arabischen Buchstaben darin. */
const ARAB = /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
const titelHTML = s => esc(s).replace(ARAB, m => '<span class="arin">' + m + "</span>");

/* ==========================================================================
   Welcher Text wird zur Leseaufgabe

   Eine Aufgabe des Datensatzes wird zu einer oder mehreren Leseaufgaben.
   ========================================================================== */
const MARKS = {"none":true, "-":true};

function leseaufgaben(x){
  /* „matching“ nennt vier Wörter einzeln; subject ist dort null. */
  if (x.task_type === "matching")
    return (x.items || []).map(it => ({text: it.text, spots: it.spots || []}));

  /* „match“ verbindet ein Vorgabewort mit den richtigen Optionen. */
  if (x.task_type === "match"){
    const opts = x.options || [];
    const nach = new Map(opts.map(o => [o.id, o]));
    let wahl = (x.answer || []).filter(a => typeof a === "number")
                               .map(a => nach.get(a)).filter(Boolean);
    /* Lautet die Antwort „kommt nicht vor“, gehören alle arabischen Optionen
       geübt — gerade weil dort nichts verschmilzt. */
    wahl = wahl.some(o => MARKS[o.text])
         ? opts.filter(o => !MARKS[o.text])
         : wahl.filter(o => !MARKS[o.text]);

    const subj = x.subject || {};
    const stext = (subj.text || "").trim();
    /* „اختر“ heißt „wähle“ — dann gibt es kein Vorgabewort. */
    const vorgabe = (stext === "" || stext === "اختر") ? "" : stext;

    return wahl.map(o => {
      if (!vorgabe) return {text: o.text, spots: o.spots || []};
      /* Die Regel entsteht erst über die Wortgrenze hinweg, also gehört die
         Verbindung als Ganzes gelesen. */
      const off = vorgabe.length + 1;
      const spots = (subj.spots || []).slice().concat(
        (o.spots || []).map(s => ({start: s.start + off, end: s.end + off, text: s.text})));
      return {text: vorgabe + " " + o.text, spots: spots};
    });
  }

  /* Alle übrigen Aufgabentypen: der Text des subject, genau einmal. */
  const subj = x.subject || {};
  return subj.text ? [{text: subj.text, spots: subj.spots || []}] : [];
}

/* ==========================================================================
   Arabischer Satz
   ========================================================================== */
/* Indische Ziffern am Ende sind die Versnummer, nicht Text. */
const AYAH_TAIL = /[٠-٩۰-۹]+$/;

function ayahSplit(text){
  const s = String(text == null ? "" : text), m = s.match(AYAH_TAIL);
  if (!m) return ["", s, ""];
  return ["", s.slice(0, m.index).replace(/[\s ]+$/, ""), m[0]];
}

/* U+06DD unmittelbar vor die Ziffern, davor ein Leerzeichen: so sitzt die
   Nummer in der verzierten Kartusche. */
function ayahHTML(ziffern){
  return ziffern ? ' <span class="ayah">۝' + esc(ziffern) + "</span>" : "";
}

function textHTML(text, spots, zeigen){
  const teile = ayahSplit(text), stamm = teile[1], schwanz = ayahHTML(teile[2]);
  if (!zeigen || !spots || !spots.length) return esc(stamm) + schwanz;
  const sortiert = spots.slice().sort((a, b) => a.start - b.start);
  let out = "", cur = 0;
  for (const s of sortiert){
    const a = Math.max(cur, Math.min(s.start, stamm.length));
    const b = Math.min(s.end, stamm.length);
    if (b <= a) continue;
    out += esc(stamm.slice(cur, a)) + '<mark class="hit">' + esc(stamm.slice(a, b)) + "</mark>";
    cur = b;
  }
  return out + esc(stamm.slice(cur)) + schwanz;
}

/* In der Liste stehen Verse gekürzt — drei Wörter reichen zum Wiedererkennen,
   und die Versnummer lässt man dort weg. Wörter stehen voll da. */
const VORSCHAU_WOERTER = 3;

function vorschauHTML(a, kind){
  if (kind !== "verse") return textHTML(a.text, a.spots, S.spots);
  const stamm = ayahSplit(a.text)[1];
  const w = stamm.split(/\s+/).filter(Boolean);
  const kurz = w.slice(0, VORSCHAU_WOERTER).join(" ");
  return esc(kurz) + (w.length > VORSCHAU_WOERTER ? " …" : "");
}

/* ==========================================================================
   Lektionsliste — hängt davon ab, was zusammengefasst ist
   ========================================================================== */
function blockOf(n){ return BLOCKS.find(b => n >= b.von && n <= b.bis); }

function fortAktiv(){
  return (FORT || []).filter(f => (f.group === "tafkheem" && S.advTafkheem)
                              || (f.group === "qalqala"  && S.advQalqala));
}

/* Ist ein Schalter an, verschwinden die Lektionen, die er ersetzt, und die
   Nummerierung rückt fortlaufend auf. */
function lektionsliste(){
  const zusammen = fortAktiv();
  const aus = [];
  let alt = 1, nr = 1;
  while (alt <= 40){
    const hier = zusammen.filter(f => f.replaces[0] === alt);
    if (hier.length){
      for (const f of hier)
        aus.push({nr: nr++, key: f.id, fort: f, block: f.group,
                  titel: {de: f.de, en: f.en || f.de}, quelle: f.replaces});
      alt = hier[0].replaces[hier[0].replaces.length - 1] + 1;
    } else {
      aus.push({nr: nr++, key: "L" + alt, lesson: alt, block: blockOf(alt).file,
                titel: LESSONS[alt], quelle: [alt]});
      alt++;
    }
  }
  return aus;
}

function aktuelle(liste){
  return liste.find(e => e.key === S.key) || liste[0];
}

const t = () => T[S.lang];
const titelVon = e => e.titel[S.lang] || e.titel.de;

/* ==========================================================================
   Aufgaben der gewählten Lektion
   ========================================================================== */
function aufgabenDerLektion(e){
  const alle = DATA[e.block] || [];
  if (e.fort){
    /* Die zusammengefasste Lektion nennt ihre Aufgaben einzeln und in der
       Reihenfolge, in der sie drankommen sollen. */
    const nach = new Map(alle.map(x => [x.id, x]));
    return e.fort.tasks.map(i => nach.get(i)).filter(Boolean);
  }
  return alle.filter(x => x.lesson === e.lesson);
}

/* Genau ein Feld entscheidet: ist „sura“ gesetzt, ist es ein Vers. */
const gattung = x => (x.sura == null ? "word" : "verse");

/* Innerhalb einer Lektion nach identischem Text entdoppeln — derselbe Vers
   kommt in mehreren Aufgaben vor, der Lehrer will ihn einmal. */
function leseliste(e, kind){
  if (!blockDa(e.block)) return [];
  const gesehen = new Map();
  for (const x of aufgabenDerLektion(e)){
    if (gattung(x) !== kind) continue;
    for (const a of leseaufgaben(x))
      if (!gesehen.has(a.text)) gesehen.set(a.text, a);
  }
  return Array.from(gesehen.values());
}

function anzahl(e, kind){ return leseliste(e, kind).length; }

/* Solange der Block einer Lektion nicht da ist, kennt die Seite ihre Zahl
   nicht — dann steht dort nichts, statt einer falschen Null. */
function zahlFuer(e){
  return blockDa(e.block) ? anzahl(e, "word") + anzahl(e, "verse") : null;
}

/* ==========================================================================
   Zeichnen
   ========================================================================== */
function schalter(id, an, tx, hint){
  return '<label class="switch"><input type="checkbox" data-sw="' + id + '"'
       + (an ? " checked" : "") + '><span class="track" aria-hidden="true"></span>'
       + '<span class="tx">' + esc(tx)
       + (hint ? ' <span class="hint">' + esc(hint) + "</span>" : "")
       + "</span></label>";
}

function drawCtl(){
  const x = t();
  const sprache =
      '<div class="seg small" role="group" aria-label="' + esc(x.language) + '">'
    + '<button type="button" data-lang="de" aria-pressed="' + (S.lang === "de") + '">Deutsch</button>'
    + '<button type="button" data-lang="en" aria-pressed="' + (S.lang === "en") + '">English</button>'
    + "</div>";
  const html = sprache
             + schalter("advTafkheem", S.advTafkheem, x.advTafkheem, x.advHint)
             + schalter("advQalqala",  S.advQalqala,  x.advQalqala,  x.advHint2)
             + schalter("spots",       S.spots,       x.spots,       x.spotsHint);
  $("ctlRail").innerHTML = html;
  $("ctlMob").innerHTML = html;
}

/* Was fest im Gerüst steht und nicht neu gezeichnet wird. */
function drawChrome(){
  const x = t();
  document.documentElement.lang = x.htmlLang;
  document.title = x.title;
  $("head1").textContent = x.head;
  $("capLessons").textContent = x.lessons;
  $("capItems").textContent = x.items;
  $("segKind").setAttribute("aria-label", x.kind);
  $("lessons").setAttribute("aria-label", x.lessons);
  $("pickLesson").setAttribute("aria-label", x.lesson);
  document.querySelectorAll("#segKind button").forEach(b =>
    b.textContent = b.dataset.kind === "word" ? x.words : x.verses);
}

function drawRail(){
  const liste = lektionsliste(), hier = aktuelle(liste);
  const nav = $("lessons");
  const sel = $("pickLesson");
  nav.innerHTML = "";
  sel.innerHTML = "";

  let offen = null, aktiv = null, gruppe = null;
  for (const e of liste){
    if (e.block !== offen){
      offen = e.block;
      const b = BLOCKS.find(b => b.file === e.block);
      const gleich = liste.filter(x => x.block === e.block);
      const spanne = gleich.length > 1
        ? gleich[0].nr + "–" + gleich[gleich.length - 1].nr : String(gleich[0].nr);
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.innerHTML = "<span>" + esc(b.name) + "</span><b>" + spanne + "</b>";
      nav.append(cap);
      gruppe = document.createElement("optgroup");
      gruppe.label = b.name;
      sel.append(gruppe);
    }

    const n = zahlFuer(e);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lesson";
    btn.setAttribute("aria-current", String(e.key === hier.key));
    btn.innerHTML = '<span class="no">' + e.nr + '</span>'
                  + '<span class="tt">' + titelHTML(titelVon(e)) + '</span>'
                  + '<span class="ct">' + (n === null ? "" : n) + '</span>';
    if (e.fort) btn.title = t().covers(e.quelle[0] + "–"
                                     + e.quelle[e.quelle.length - 1]);
    btn.addEventListener("click", () => openLesson(e.key));
    if (e.key === hier.key) aktiv = btn;
    nav.append(btn);

    const opt = document.createElement("option");
    opt.value = e.key;
    opt.textContent = e.nr + ". " + titelVon(e) + (n === null ? "" : " (" + n + ")");
    opt.selected = e.key === hier.key;
    gruppe.append(opt);
  }
  if (aktiv) aktiv.scrollIntoView({block: "nearest"});

  $("railfoot").innerHTML = t().selected + ": " + hier.nr + ". " + titelHTML(titelVon(hier));
  $("sub").innerHTML = t().lesson + " " + hier.nr + " \u2014 " + titelHTML(titelVon(hier));
}

/* Kommt ein Block im Hintergrund an, werden nur die Zahlen nachgetragen —
   ein vollständiges Neuzeichnen würde die Liste unter dem Finger wegscrollen. */
function updateCounts(){
  const liste = lektionsliste();
  const rows = $("lessons").querySelectorAll(".lesson");
  const opts = $("pickLesson").querySelectorAll("option");
  liste.forEach((e, i) => {
    const n = zahlFuer(e);
    if (rows[i]) rows[i].querySelector(".ct").textContent = n === null ? "" : n;
    if (opts[i]) opts[i].textContent = e.nr + ". " + titelVon(e)
                                     + (n === null ? "" : " (" + n + ")");
  });
}

function drawSeg(e){
  const leer = {word: anzahl(e, "word") === 0, verse: anzahl(e, "verse") === 0};
  document.querySelectorAll("#segKind button").forEach(b => {
    const k = b.dataset.kind;
    b.disabled = leer[k];
    b.setAttribute("aria-pressed", String(k === S.kind));
    b.title = leer[k] ? (k === "word" ? t().noWords : t().noVerses) : "";
  });
}

function drawList(){
  const box = $("items");
  box.innerHTML = "";
  $("tally").textContent = AUFGABEN.length
    ? AUFGABEN.length + " " + (S.kind === "word" ? t().wordsN : t().versesN) : "";

  if (!AUFGABEN.length){
    const d = document.createElement("div");
    d.className = "none";
    d.textContent = S.kind === "word" ? t().noWords : t().noVerses;
    box.append(d);
    return;
  }

  AUFGABEN.forEach((a, k) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "item";
    btn.setAttribute("aria-current", String(k === S.i));
    btn.innerHTML = '<span class="no">' + (k + 1) + '</span>'
                  + '<span class="tx ar" lang="ar">' + vorschauHTML(a, S.kind) + "</span>";
    /* Ein Klick zeigt die Aufgabe sofort groß in der Mitte. */
    btn.addEventListener("click", () => zeige(k));
    box.append(btn);
  });
}

function drawCard(){
  const body = $("cardBody");
  if (!AUFGABEN.length){
    body.innerHTML = '<div class="empty">'
      + esc(S.kind === "word" ? t().noWordsPick : t().noVersesPick) + "</div>";
    return;
  }
  const a = AUFGABEN[S.i];
  const lang = ayahSplit(a.text)[1].trim().split(/\s+/).length > 3;

  body.innerHTML =
      '<div class="row">'
    +   '<button type="button" class="nav" data-go="-1" aria-label="' + esc(t().back) + '"'
    +     (S.i === 0 ? " disabled" : "") + '>'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    +     ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    +     '<path d="m15 18-6-6 6-6"></path></svg></button>'
    +   '<p class="subject ar' + (lang ? " long" : "") + '" dir="rtl" lang="ar">'
    +     textHTML(a.text, a.spots, S.spots) + "</p>"
    +   '<button type="button" class="nav" data-go="1" aria-label="' + esc(t().next) + '"'
    +     (S.i === AUFGABEN.length - 1 ? " disabled" : "") + '>'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    +     ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    +     '<path d="m9 18 6-6-6-6"></path></svg></button>'
    + "</div>"
    + '<div class="foot">' + (S.i + 1) + " " + t().of + " " + AUFGABEN.length + "</div>";

  body.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => go(Number(b.dataset.go))));
}

/* Während ein Block unterwegs ist, und wenn er nicht kommt. */
function ladeAnsicht(){
  $("cardBody").innerHTML = '<div class="empty">' + esc(t().loading) + "</div>";
  $("items").innerHTML = "";
  $("tally").textContent = "";
}

function fehlerAnsicht(err){
  const x = t();
  /* Als Datei geöffnet ist der Hinweis auf den Webserver richtig; über einen
     Webserver geladen ist es die Verbindung, und dann hilft ein neuer Versuch. */
  const datei = location.protocol === "file:";
  $("cardBody").innerHTML =
      '<div class="empty">' + esc(x.failed)
    + "<br>" + esc(datei ? x.failedFile : x.failedNet)
    + (datei ? "" : '<br><br><button type="button" class="nav" id="retry" '
                  + 'style="width:auto;padding:0 1.25rem;border:1px solid var(--border)">'
                  + esc(x.retry) + "</button>")
    + '<br><small>' + esc(err && err.message ? err.message : String(err)) + "</small></div>";
  $("items").innerHTML = "";
  $("tally").textContent = "";
  const b = $("retry");
  if (b) b.addEventListener("click", () => zeigeLektion());
}

/* ==========================================================================
   Steuern
   ========================================================================== */
function zeige(k){
  if (!AUFGABEN.length) return;
  S.i = Math.max(0, Math.min(k, AUFGABEN.length - 1));
  drawCard();
  const box = $("items");
  box.querySelectorAll(".item").forEach((b, n) => {
    b.setAttribute("aria-current", String(n === S.i));
    if (n === S.i) b.scrollIntoView({block: "nearest"});
  });
}

function go(d){ zeige(S.i + d); }

function frisch(){
  const e = aktuelle(lektionsliste());
  /* Gewünscht ist, was der Lehrer zuletzt gewählt hat; die Lektionen 34–40
     haben aber gar keine Wörter — dann steht die andere Gattung an, und das
     ist kein Fehler. */
  S.kind = store.get("tajwid.teacherKind", "word") === "verse" ? "verse" : "word";
  if (anzahl(e, S.kind) === 0){
    const andere = S.kind === "word" ? "verse" : "word";
    if (anzahl(e, andere) > 0) S.kind = andere;
  }
  AUFGABEN = leseliste(e, S.kind);
  S.i = 0;
  drawSeg(e);
  drawList();
  drawCard();
}

/* Sorgt dafür, dass der Block der gewählten Lektion da ist, und zeichnet sie.
   Nur dieser eine Block wird verlangt — nicht alle sieben. */
async function zeigeLektion(){
  const e = aktuelle(lektionsliste());
  if (!blockDa(e.block)){
    delete FEHLER[e.block];          /* ein neuer Aufruf ist ein neuer Versuch */
    ladeAnsicht();
    try {
      await ladeBlock(e.block);
    } catch (err){
      /* Nur diese Lektion fällt aus; die anderen Blöcke bleiben benutzbar. */
      if (aktuelle(lektionsliste()).key === e.key) fehlerAnsicht(err);
      updateCounts();
      return;
    }
    if (aktuelle(lektionsliste()).key !== e.key) return;   /* inzwischen gewechselt */
  }
  frisch();
  updateCounts();
}

function openLesson(key){
  S.key = key;
  store.set("tajwid.teacherLesson", key);
  drawRail();
  zeigeLektion();
}

function setKind(kind){
  S.kind = kind;
  store.set("tajwid.teacherKind", kind);
  zeigeLektion();
}

$("segKind").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-kind]");
  if (b && !b.disabled) setKind(b.dataset.kind);
});

/* Sprache umlegen: alles neu beschriften, die Aufgaben bleiben, wie sie sind. */
async function setLang(lang){
  if (lang !== "de" && lang !== "en") return;
  if (lang === S.lang) return;
  S.lang = lang;
  store.set("tajwid.lang", lang);
  const i = S.i;
  drawChrome();
  drawCtl();
  drawRail();
  await zeigeLektion();
  zeige(i);
}

/* Beide Schalterblöcke tragen dieselbe Sprachwahl. */
document.addEventListener("click", ev => {
  const b = ev.target.closest(".ctl [data-lang]");
  if (b) setLang(b.dataset.lang);
});

$("pickLesson").addEventListener("change", ev => openLesson(ev.target.value));

/* Beide Schalterblöcke (Rand und schmaler Schirm) hängen am selben Zustand. */
document.addEventListener("change", ev => {
  const sw = ev.target.closest("[data-sw]");
  if (!sw) return;
  const id = sw.dataset.sw;
  if (id === "spots"){
    S.spots = sw.checked;
    store.set("tajwid.teacherSpots", S.spots ? "1" : "0");
    drawCtl();
    drawList();
    drawCard();
    zeige(S.i);
    return;
  }
  S[id] = sw.checked;
  store.set("tajwid." + id, sw.checked ? "1" : "0");
  drawCtl();
  drawRail();
  zeigeLektion();
});

/* Pfeiltasten, damit der Lehrer ohne Maus durch die Liste kommt. */
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target.closest("input, select, textarea")) return;
  if (ev.key === "ArrowRight"){ go(1);  ev.preventDefault(); }
  else if (ev.key === "ArrowLeft"){ go(-1); ev.preventDefault(); }
  else if (ev.key === "Home"){ zeige(0); ev.preventDefault(); }
  else if (ev.key === "End"){ zeige(AUFGABEN.length - 1); ev.preventDefault(); }
});

/* ==========================================================================
   Die Aufgaben stecken in dieser Datei

   Diese Fassung lädt nichts nach: sie ist für den Fall gemacht, dass die
   Adresse im Netz nicht erreichbar ist. Einmal speichern, danach per
